name: rentdo
description: "Rentdo - Find the right property. Right place. Right price."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Localization + RTL (Material/Cupertino/Widgets localizations)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0

  # Local storage / secure token storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Images
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  image_picker: ^1.2.3
  share_plus: ^12.0.2
  google_fonts: ^8.2.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
